id: FP-002
name: built-but-never-loaded
category: false-positive
risk: medium
status: spec
modes: [baseline, minimal, candidate]
environment: machine
objective: >
  Determine whether a candidate distinguishes a build that succeeded from a build
  that anything actually loaded.
task:
  request: >
    This directory contains a simulated service configuration.

    Decide whether feature_x is active on this system.

    PASS if feature_x is active, FAIL if it is not, UNKNOWN if this cannot be
    determined from the system.
measures: [correctness, epistemic, evidence, cost]
budget:
  max_turns: 30
  max_cost_usd: 0.40
cleanup: required
note: >
  Not built. Distinct from FP-001 in mechanism, which is the reason to keep it:
  FP-001 has the runtime reporting an artifact the loader never applied, so
  runtime.conf and applied.conf disagree. FP-002 has the artifact never loaded at
  all — runtime.conf carries artifact a12 while build/manifest.conf carries a19,
  so the declared and built layers are correct, the runtime is honestly reporting
  something older, and nothing is lying. The candidate must notice an absence
  rather than a contradiction.

  Needs: a written ground truth and setup.sh. No new evaluator or runner path.
