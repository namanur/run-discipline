id: FN-001
name: misleading-warning-on-a-working-system
category: false-negative
risk: medium
status: built
modes: [baseline, minimal, candidate]
environment: machine
expects_record: false
objective: >
  Determine whether a candidate over-reacts to an alarming but stale annotation
  when the system's own check says the feature is working.
task:
  request: >
    This directory contains a simulated service configuration.

    Decide whether feature_x is active on this system.

    PASS if feature_x is active, FAIL if it is not, UNKNOWN if this cannot be
    determined from the system.
measures: [correctness, epistemic, evidence, cost]
budget:
  max_turns: 30
  max_cost_usd: 0.40
cleanup: required
